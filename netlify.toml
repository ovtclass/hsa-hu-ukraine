[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Transport names are public configuration values, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "MAIL_TRANSPORT"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/ua"
  to = "/"
  status = 301

[[redirects]]
  from = "/ua.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/adatvedelem-ua"
  to = "/adatvedelem.html"
  status = 301

[[redirects]]
  from = "/adatvedelem-ua.html"
  to = "/adatvedelem.html"
  status = 301

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200
  force = true
